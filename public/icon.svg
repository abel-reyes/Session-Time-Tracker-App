<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ffffff" stroke-width="24" stroke-opacity="0.9" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
  <!-- Clock hands -->
  <line x1="256" y1="256" x2="256" y2="140" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
  <line x1="256" y1="256" x2="340" y2="256" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" />
  <!-- Top stopwatch button -->
  <rect x="226" y="44" width="60" height="24" rx="8" fill="#ffffff" opacity="0.85" />
</svg>
